[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona"
version = "0.1.0"
description = "Train open-weights LLMs to have distinct, consistent personalities."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.6",
  "pydantic>=2.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Local / OpenAI-compatible teacher (vLLM, Ollama, llama.cpp server, ...)
openai = ["openai>=1.40"]
# GPU training + local inference. On a CUDA box, also `pip install unsloth` for ~2x faster QLoRA.
train = [
  "torch>=2.3",
  "transformers>=5.0",
  "datasets>=2.20",
  "peft>=0.18",
  "trl>=1.0",
  "accelerate>=0.34",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
eval = ["lm-eval>=0.4.5"]
dev = ["pytest>=8"]

[project.scripts]
persona = "persona.cli:main"

[tool.setuptools.packages.find]
include = ["persona*"]
